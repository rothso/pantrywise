version: 2
sql:
  - engine: "postgresql"
    schema: "./migrations"
    queries:
      - "./internal/grocery/queries/grocery.sql"
    gen:
      go:
        out: "./internal/db"
        package: "db"
        sql_package: "pgx/v5"
        overrides:
          - db_type: "uuid"
            nullable: false
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"
          - db_type: "uuid"
            nullable: true
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"
              pointer: true
