syntax = "proto3";

package pantrywise.grocery.v1;

import "google/protobuf/timestamp.proto";

option go_package = "pantrywise/internal/gen/pantrywise/grocery/v1;groceryv1";

message Food {
  string food_id = 1;
  string name = 2;
  google.protobuf.Timestamp created_at = 3;
  google.protobuf.Timestamp updated_at = 4;
}

message SearchFoodsRequest {
  string query = 1;
  repeated string excluded_food_ids = 2;
}

message SearchFoodsResponse {
  repeated Food foods = 1;
}

service FoodService {
  rpc SearchFoods(SearchFoodsRequest) returns (SearchFoodsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
}
